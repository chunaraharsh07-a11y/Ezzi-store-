<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ezzi Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eaec;--card:#fff;--ink:#15171c;--mute:#5d6470;--acc:#2447f5;--line:#d3d6db;--ok:#17803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1b1e25;--ink:#f1f2f4;--mute:#9aa1ad;--acc:#6d86ff;--line:#2d313a;--ok:#4cc77a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#1b1e25;--ink:#f1f2f4;--mute:#9aa1ad;--acc:#6d86ff;--line:#2d313a;--ok:#4cc77a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3,.brand{font-family:Archivo,system-ui,sans-serif;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--ink)}
.brand{font-weight:900;font-size:26px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--acc)}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:6px;font-weight:700}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:11px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.hero{padding:28px 16px 8px;max-width:980px;margin:0 auto}
.hero h1{font-size:clamp(38px,9vw,72px);line-height:.95;font-weight:900;letter-spacing:-.03em}
.hero p{color:var(--mute);margin:10px 0 0;max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border:2px solid var(--ink);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.p img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--line)}
.p div{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.p h3{font-size:15px;font-weight:800}
.price{font-weight:800}
.sz{display:flex;gap:4px}
.sz button{flex:1;padding:6px 0;font-size:13px;border-width:2px;border-color:var(--line)}
.sz button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.p .add{margin-top:auto}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border:2px solid var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img{width:54px;height:66px;object-fit:cover;border-radius:4px}
.item .g{flex:1;font-size:14px}
.q button{padding:2px 9px}
.note{font-size:13px;color:var(--mute)}
.box{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
.qr{display:block;width:230px;max-width:70%;margin:8px auto;border-radius:8px;background:#fff}
.opt{border-color:var(--acc)}
.err{color:#d6322c;font-size:14px;min-height:20px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;display:none;max-width:90%}
.badge{background:var(--acc);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.ok{color:var(--ok);font-weight:800}
</style>
</head>
<body>
<header>
  <div class="brand">ezzi<i>.</i>store</div>
  <div class="row"><button id="acct" onclick="openAcct()">Log in</button><button id="cartBtn" onclick="openCart()">Cart<span class="badge" id="cnt">0</span></button></div>
</header>
<div class="hero"><h1>Graphic tees.<br>₹299 each.</h1><p>Pick your size, pay a small advance by UPI QR, and pay the rest when it arrives.</p></div>
<main class="wrap"><div class="grid" id="grid"></div></main>

<div class="scrim" id="s-login"><div class="sheet" id="loginBox"></div></div>
<div class="scrim" id="s-cart"><div class="sheet" id="cartBox"></div></div>
<div class="toast" id="toast"></div>

const NAMES=["Explore","Devil’s Game","Break Rules","Red Bull RB20","Raceway Legends","Don’t Quit","Brooklyn New York","Try Your Luck","Urban Positive","Don’t Quit – Style 2","Open Your Eyes","Headphones Ringer"];
const P=NAMES.map((n,i)=>({id:i,name:n,img:IMGS[i],size:"M"}));
const SIZES=["S","M","L","XL"];
let cart=[],user=null,otp=null,orders=[];
function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
user=ls("ezzi_user");cart=ls("ezzi_cart")||[];orders=ls("ezzi_orders")||[];
const $=id=>document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function close(id){$(id).classList.remove("open")}
function open(id){$(id).classList.add("open")}
document.querySelectorAll(".scrim").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)s.classList.remove("open")}));

function renderGrid(){
  $("grid").innerHTML=P.map(p=>`<div class="p"><img src="${p.img}" alt="${esc(p.name)} t-shirt" loading="lazy"><div>
  <h3>${esc(p.name)}</h3><span class="price">₹${CONFIG.price}</span>
  <div class="sz" role="group" aria-label="Size">${SIZES.map(s=>`<button class="${s===p.size?"on":""}" onclick="setSize(${p.id},'${s}')">${s}</button>`).join("")}</div>
  <button class="pri add" onclick="add(${p.id})">Add to cart</button></div></div>`).join("");
}
function setSize(id,s){P[id].size=s;renderGrid()}
function add(id){
  const p=P[id],k=cart.find(c=>c.id===id&&c.size===p.size);
  if(k)k.qty++;else cart.push({id,size:p.size,qty:1});
  saveCart();toast(p.name+" ("+p.size+") added")}
function saveCart(){ls("ezzi_cart",cart);$("cnt").textContent=cart.reduce((a,c)=>a+c.qty,0)}
function total(){return cart.reduce((a,c)=>a+c.qty,0)*CONFIG.price}

/* ---------- login: phone + OTP ---------- */
function openAcct(){
  if(user){
    $("loginBox").innerHTML=`<h2>Your account</h2><p>Logged in as <b>+91 ${user.phone}</b></p>
    <h3>Your orders</h3>${orders.length?orders.map(o=>`<div class="box"><b>${esc(o.id)}</b> · ₹${o.total}<br><span class="note">${esc(o.items)}</span></div>`).join(""):'<p class="note">No orders yet.</p>'}
    <div class="row"><button onclick="logout()">Log out</button><button onclick="close('s-login')">Close</button></div>`;
  }else loginForm();
  open("s-login")}
function loginForm(){
  $("loginBox").innerHTML=`<h2>Log in</h2><p class="note">Enter your mobile number. We’ll send a one-time code.</p>
  <label for="ph">Mobile number</label><input id="ph" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel-national">
  <div class="err" id="lerr"></div><button class="pri" style="width:100%" onclick="sendOtp()">Send OTP</button>`}
async function sendOtp(){
  const ph=$("ph").value.trim();
  if(!/^[6-9]\d{9}$/.test(ph)){$("lerr").textContent="Enter a valid 10-digit Indian mobile number.";return}
  otp=String(Math.floor(1000+Math.random()*9000));
  if(CONFIG.otpEndpoint){try{await fetch(CONFIG.otpEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:ph})});otp=null}catch(e){$("lerr").textContent="Could not send the OTP. Try again.";return}}
  $("loginBox").innerHTML=`<h2>Enter OTP</h2><p class="note">Code sent to +91 ${ph}.</p>
  ${otp?`<div class="box note">Demo mode: SMS is not connected yet, so your code is <b>${otp}</b>.</div>`:""}
  <label for="otp">4-digit code</label><input id="otp" inputmode="numeric" maxlength="4" autocomplete="one-time-code">
  <div class="err" id="lerr"></div><button class="pri" style="width:100%" onclick="verify('${ph}')">Verify and log in</button>`}
async function verify(ph){
  const c=$("otp").value.trim();let good=false;
  if(otp)good=c===otp;
  else{try{const r=await fetch(CONFIG.otpEndpoint+"/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:ph,code:c})});good=r.ok}catch(e){}}
  if(!good){$("lerr").textContent="That code is wrong. Check it and try again.";return}
  user={phone:ph};ls("ezzi_user",user);$("acct").textContent="+91 "+ph.slice(0,2)+"••••"+ph.slice(-2);
  close("s-login");toast("Logged in");if(pendingCheckout){pendingCheckout=false;openCart()}}
function logout(){user=null;ls("ezzi_user",null);$("acct").textContent="Log in";close("s-login")}
let pendingCheckout=false;

/* ---------- cart + checkout ---------- */
function openCart(){
  if(!cart.length){$("cartBox").innerHTML=`<h2>Your cart</h2><p class="note">Your cart is empty. Add a tee to get started.</p><button onclick="close('s-cart')">Keep shopping</button>`;open("s-cart");return}
  $("cartBox").innerHTML=`<div class="row"><h2>Your cart</h2><button onclick="close('s-cart')">Close</button></div>
  ${cart.map((c,i)=>`<div class="item"><img src="${P[c.id].img}" alt=""><div class="g"><b>${esc(P[c.id].name)}</b><br>Size ${c.size} · ₹${CONFIG.price}</div>
  <span class="q"><button onclick="qty(${i},-1)" aria-label="Less">−</button> ${c.qty} <button onclick="qty(${i},1)" aria-label="More">+</button></span></div>`).join("")}
  <div class="row" style="margin:14px 0"><b>Total</b><b style="font-size:22px">₹${total()}</b></div>
  <button class="pri" style="width:100%" onclick="checkout()">Checkout</button>`;
  open("s-cart")}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);saveCart();openCart()}
function checkout(){
  if(!user){pendingCheckout=true;close("s-cart");openAcct();return}
  const adv=Math.min(CONFIG.advance,total()),rest=total()-adv;
  $("cartBox").innerHTML=`<div class="row"><h2>Checkout</h2><button onclick="openCart()">Back</button></div>
  <label for="nm">Full name</label><input id="nm" autocomplete="name">
  <label for="ad">Delivery address</label><textarea id="ad" rows="3" autocomplete="street-address"></textarea>
  <label for="pc">Pincode</label><input id="pc" inputmode="numeric" maxlength="6" autocomplete="postal-code">
  <div class="box opt"><b>Partial COD</b><br>Pay ₹${adv} now by UPI. Pay the remaining <b>₹${rest}</b> in cash on delivery. Full COD is not available.</div>
  <div class="box" style="text-align:center"><div class="note">Scan with any UPI app and pay ₹${adv}</div><img class="qr" src="${QR}" alt="Ezzi Store UPI QR code">
  <div class="note">Take a screenshot of the payment. You’ll send it on WhatsApp.</div></div>
  <label for="utr">UPI transaction ID (UTR)</label><input id="utr" inputmode="numeric" maxlength="12" placeholder="12-digit number from your UPI app">
  <div class="err" id="cerr"></div>
  <button class="pri" style="width:100%" onclick="place(${adv},${rest})">Place order on WhatsApp</button>`}
function place(adv,rest){
  const nm=$("nm").value.trim(),ad=$("ad").value.trim(),pc=$("pc").value.trim(),utr=$("utr").value.trim();
  const e=$("cerr");
  if(nm.length<2||ad.length<8)return e.textContent="Enter your name and full address.";
  if(!/^\d{6}$/.test(pc))return e.textContent="Enter a 6-digit pincode.";
  if(!/^\d{12}$/.test(utr))return e.textContent="Enter the 12-digit UPI transaction ID after paying.";
  const items=cart.map(c=>`${P[c.id].name} (${c.size}) x${c.qty}`).join(", ");
  const id="EZ"+Date.now().toString().slice(-6);
  const msg=`*New order ${id} – ${CONFIG.shop}*\n${items}\nTotal: ₹${total()}\nAdvance paid: ₹${adv} (UTR ${utr})\nPay on delivery: ₹${rest}\n\nName: ${nm}\nPhone: +91 ${user.phone}\nAddress: ${ad}, ${pc}\n\n(Payment screenshot attached below)`;
  orders.unshift({id,items,total:total()});ls("ezzi_orders",orders);
  const url="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg);
  cart=[];saveCart();
  $("cartBox").innerHTML=`<h2 class="ok">Order ${id} ready</h2><p>Tap below to send it on WhatsApp, then attach your payment screenshot. Your order is confirmed once we reply.</p>
  <a href="${url}" target="_blank" rel="noopener"><button class="pri" style="width:100%">Open WhatsApp</button></a><p><button onclick="close('s-cart')">Done</button></p>`;
  window.open(url,"_blank")}
if(user)$("acct").textContent="+91 "+user.phone.slice(0,2)+"••••"+user.phone.slice(-2);
renderGrid();saveCart();
</script>
</body>
</html>
